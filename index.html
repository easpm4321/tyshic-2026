<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>桃高資訊社 第六屆官網</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        html { scroll-behavior: smooth; scroll-padding-top: 90px; }
        :root {
            --bg-color: #12121a;
            --grid-color: rgba(255, 255, 255, 0.04);
            --card-bg: rgba(25, 25, 38, 0.75);
            --border-color: rgba(138, 127, 255, 0.25);
            --primary-accent: #a78bfa;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Noto Sans TC', sans-serif; margin: 0; overflow-x: hidden; }
        
        /* 修正手機版圖片顯示問題：確保容器與圖片在 RWD 下正常運作 */
        .mascot-container { flex: 0.8; display: flex; justify-content: center; align-items: center; }
        .mascot-wrapper { 
            position: relative; width: 280px; height: 280px; border-radius: 50%; overflow: hidden;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.25) 0%, transparent 70%);
            transition: all 0.4s ease;
        }
        .mascot-img { width: 100%; height: 100%; object-fit: cover; }

        /* 滾動時縮小懸浮 */
        .mascot-wrapper.scrolled {
            position: fixed; bottom: 20px; right: 20px;
            width: 80px; height: 80px; z-index: 999;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* Hero 區塊 */
        .hero { display: flex; align-items: center; justify-content: space-between; max-width: 1200px; margin: 0 auto; padding: 120px 2rem; gap: 2rem; }
        .hero-title { font-size: 4rem; font-weight: 700; }

        /* 手機版適配 */
        @media (max-width: 768px) {
            .hero { flex-direction: column-reverse; text-align: center; padding-top: 60px; }
            .hero-title { font-size: 2.5rem; }
            nav ul { display: none; } /* 若有手機選單可在此處調整 */
            
            /* 強制設定手機版圖片大小，避免隱藏 */
            .mascot-wrapper { width: 180px; height: 180px; }
            .mascot-wrapper.scrolled { width: 60px; height: 60px; }
        }
    </style>
</head>
<body>

    <section class="hero" id="home">
        <div class="hero-text">
            <h1>桃高資訊社</h1>
        </div>

        <!-- 吉祥物區塊：已移除隱藏設定，手機版會自動顯示 -->
        <div class="mascot-container">
            <div class="mascot-wrapper" id="mascotWrapper">
                <!-- 加上 cache-busting 參數 ?v=1 確保 GitHub 讀取到最新圖片 -->
                <img src="https://github.com/user-attachments/assets/508cc194-3509-4b71-a422-d645562ee6d1?v=1" alt="社團吉祥物" class="mascot-img" referrerpolicy="no-referrer">
            </div>
        </div>
    </section>

    <script>
        // 滾動縮小效果
        const mascotWrapper = document.getElementById('mascotWrapper');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 150) {
                mascotWrapper.classList.add('scrolled');
            } else {
                mascotWrapper.classList.remove('scrolled');
            }
        });
    </script>
</body>
</html>
